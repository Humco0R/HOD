name: hod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hod
      POSTGRES_USER: hod
      POSTGRES_PASSWORD: hod
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hod -d hod']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:55432:5432'

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:56379:6379'

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ['node', 'apps/backend/dist/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hod:hod@postgres:5432/hod
      REDIS_URL: redis://redis:6379
      WORKSPACE_DEFAULT_TIMEZONE: ${WORKSPACE_DEFAULT_TIMEZONE:-UTC}
      MIGRATIONS_PATH: /app/apps/backend/drizzle
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://hod:hod@postgres:5432/hod
      REDIS_URL: redis://redis:6379
      WORKSPACE_DEFAULT_TIMEZONE: ${WORKSPACE_DEFAULT_TIMEZONE:-UTC}
      MAX_TRANSPORT: ${MAX_TRANSPORT:-disabled}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
      MAX_API_VERSION: ${MAX_API_VERSION:-2026-07-01}
      MAX_WEBHOOK_PUBLIC_URL: ${MAX_WEBHOOK_PUBLIC_URL:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_MINIAPP_BOT_NAME: ${MAX_MINIAPP_BOT_NAME:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_B2B}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Pro}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://api.giga.chat}
      GIGACHAT_TIMEOUT_MS: ${GIGACHAT_TIMEOUT_MS:-60000}
      AI_HIGH_CONFIDENCE_THRESHOLD: ${AI_HIGH_CONFIDENCE_THRESHOLD:-0.85}
      AI_MEDIUM_CONFIDENCE_THRESHOLD: ${AI_MEDIUM_CONFIDENCE_THRESHOLD:-0.60}
      MINIAPP_SESSION_TTL_SECONDS: ${MINIAPP_SESSION_TTL_SECONDS:-28800}
      MAX_INIT_DATA_MAX_AGE_SECONDS: ${MAX_INIT_DATA_MAX_AGE_SECONDS:-300}
      PROOF_STORAGE_PATH: /data/proofs
      PROOF_MAX_BYTES: ${PROOF_MAX_BYTES:-10485760}
      MINIAPP_ORIGIN: ${MINIAPP_ORIGIN:-http://localhost:8080}
      REMINDER_LEAD_MINUTES: ${REMINDER_LEAD_MINUTES:-60}
      REMINDER_SCAN_INTERVAL_SECONDS: ${REMINDER_SCAN_INTERVAL_SECONDS:-60}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7}
      MAX_RATE_LIMIT_PER_SECOND: ${MAX_RATE_LIMIT_PER_SECOND:-10}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - proof-data:/data/proofs

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ['node', 'apps/backend/dist/worker.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://hod:hod@postgres:5432/hod
      REDIS_URL: redis://redis:6379
      WORKSPACE_DEFAULT_TIMEZONE: ${WORKSPACE_DEFAULT_TIMEZONE:-UTC}
      MAX_TRANSPORT: ${MAX_TRANSPORT:-disabled}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
      MAX_API_VERSION: ${MAX_API_VERSION:-2026-07-01}
      MAX_WEBHOOK_PUBLIC_URL: ${MAX_WEBHOOK_PUBLIC_URL:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_MINIAPP_BOT_NAME: ${MAX_MINIAPP_BOT_NAME:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_B2B}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Pro}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://api.giga.chat}
      GIGACHAT_TIMEOUT_MS: ${GIGACHAT_TIMEOUT_MS:-60000}
      AI_HIGH_CONFIDENCE_THRESHOLD: ${AI_HIGH_CONFIDENCE_THRESHOLD:-0.85}
      AI_MEDIUM_CONFIDENCE_THRESHOLD: ${AI_MEDIUM_CONFIDENCE_THRESHOLD:-0.60}
      MINIAPP_SESSION_TTL_SECONDS: ${MINIAPP_SESSION_TTL_SECONDS:-28800}
      MAX_INIT_DATA_MAX_AGE_SECONDS: ${MAX_INIT_DATA_MAX_AGE_SECONDS:-300}
      PROOF_STORAGE_PATH: /data/proofs
      PROOF_MAX_BYTES: ${PROOF_MAX_BYTES:-10485760}
      MINIAPP_ORIGIN: ${MINIAPP_ORIGIN:-http://localhost:8080}
      REMINDER_LEAD_MINUTES: ${REMINDER_LEAD_MINUTES:-60}
      REMINDER_SCAN_INTERVAL_SECONDS: ${REMINDER_SCAN_INTERVAL_SECONDS:-60}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7}
      MAX_RATE_LIMIT_PER_SECOND: ${MAX_RATE_LIMIT_PER_SECOND:-10}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - proof-data:/data/proofs

  miniapp:
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.29-alpine
    ports:
      - '8080:8080'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      miniapp:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  proof-data:
