version: '1.0'
solution:
  id: hod
  name: ХОД
  team: Микод
api:
  contract: ./openapi.yaml
  base_url:
    local: http://localhost:8080
    production: https://max.mi-kod.ru
  content_type: application/json
  authentication:
    production: signed MAX initData exchanged at POST /api/auth/max for an HttpOnly hod_session cookie
    live_test_value: 'Use your own MAX account: open https://max.ru/t252_hakaton_max_bot inside MAX, join https://max.ru/join/HYzBHJBc_LAWMGg0FexqzpPVdl7UMzngIbuyIERBFT0, then open the Mini App to receive fresh signed initData and an HttpOnly session cookie. No static login, password or provider token is needed to verify the deployed service.'
    local_verification:
      enabled_only_when: NODE_ENV=development and MINIAPP_DEV_AUTH=true
      endpoint: POST /api/auth/dev
      body: { externalUserId: '<SEE test_data.roles>' }
    note: No repository-stored production login, password, initData, cookie or provider secret exists.
required_checks:
  - id: readiness
    role: unauthenticated technical expert
    method: GET
    path: /health/ready
    parameters: []
    expected_status_codes: [200, 503]
    expected_content_type: application/json
    required_response_fields: [status, dependencies.postgres, dependencies.redis]
    pass_condition: HTTP 200, status=ready, postgres=up, redis=up; when MAX is configured, dependencies.max=up is also required.
  - id: max_auth
    role: MAX Mini App user
    method: POST
    path: /api/auth/max
    body:
      initData: '<FRESH_SIGNED_INIT_DATA_FROM_MAX_MINI_APP>'
    expected_status_codes: [200, 401, 403, 503]
    expected_content_type: application/json
    required_response_fields: [id, firstName, lastName, externalUserId]
    pass_condition: Valid fresh initData returns 200 and an HttpOnly hod_session cookie; invalid data returns 401.
  - id: current_user
    role: authenticated workspace member
    method: GET
    path: /api/me
    headers:
      Cookie: hod_session=<SESSION_FROM_MAX_AUTH>
    expected_status_codes: [200, 401]
    expected_content_type: application/json
    required_response_fields: [id, firstName, lastName, externalUserId]
  - id: list_assigned_actions
    role: authenticated workspace member
    method: GET
    path: /api/actions
    query:
      view: assigned
    headers:
      Cookie: hod_session=<SESSION_FROM_MAX_AUTH>
    expected_status_codes: [200, 401]
    expected_content_type: application/json
    required_response_fields: [actions]
  - id: create_personal_action
    role: authenticated MAX user
    method: POST
    path: /api/actions
    headers:
      Cookie: hod_session=<SESSION_FROM_MAX_AUTH>
      Origin: '<CONFIGURED_MINIAPP_ORIGIN>'
    body:
      title: Проверить тестовый объект
      description: Тестовые данные для технической проверки
      deadlineKind: UNKNOWN
      deadlineDate: null
      deadlineAt: null
      idempotencyKey: '<NEW_UUID>'
    expected_status_codes: [200, 400, 401, 403]
    expected_content_type: application/json
    required_response_fields: [id, created]
    pass_condition: The same idempotencyKey returns the same Action and does not create a duplicate.
  - id: action_detail
    role: authorized action participant
    method: GET
    path: /api/actions/{id}
    path_parameters:
      id: '<ACTION_UUID>'
    headers:
      Cookie: hod_session=<SESSION_FROM_MAX_AUTH>
    expected_status_codes: [200, 401, 404]
    expected_content_type: application/json
    required_response_fields: [id, title, status, creator, assignee, events, attachments]
  - id: action_transition
    role: authorized creator or assignee according to state
    method: POST
    path: /api/actions/{id}/transitions
    path_parameters:
      id: '<ACTION_UUID>'
    headers:
      Cookie: hod_session=<SESSION_FROM_MAX_AUTH>
      Origin: '<CONFIGURED_MINIAPP_ORIGIN>'
    body:
      command: ACCEPT
      idempotencyKey: '<UNIQUE_TEST_KEY>'
    expected_status_codes: [200, 400, 401, 403, 404, 409]
    expected_content_type: application/json
    required_response_fields: [status, idempotent]
  - id: forbidden_cross_workspace_read
    role: authenticated user from another workspace
    method: GET
    path: /api/actions/{id}
    path_parameters:
      id: '<FOREIGN_ACTION_UUID>'
    headers:
      Cookie: hod_session=<FOREIGN_SESSION>
    expected_status_codes: [404]
    expected_content_type: application/json
    required_response_fields: [error]
test_data:
  classification: synthetic/manual technical-check data
  manifest: ./api-test-data.json
  compose_override: docker-compose.api-test.yml
  seed:
    powershell: Get-Content -Raw scripts/api-test-seed.sql | docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U hod -d hod
    bash: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U hod -d hod < scripts/api-test-seed.sql
  reset:
    powershell: Get-Content -Raw scripts/api-test-reset.sql | docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U hod -d hod
    bash: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U hod -d hod < scripts/api-test-reset.sql
  roles:
    creator_owner:
      externalUserId: '990000001'
      userId: 00000000-0000-4000-8000-000000000001
    assignee_member:
      externalUserId: '990000002'
      userId: 00000000-0000-4000-8000-000000000002
    foreign_owner:
      externalUserId: '990000003'
      userId: 00000000-0000-4000-8000-000000000003
  stable_ids:
    main_workspace: 00000000-0000-4000-8000-000000000101
    foreign_workspace: 00000000-0000-4000-8000-000000000102
    proof_action: 00000000-0000-4000-8000-000000000301
    foreign_action: 00000000-0000-4000-8000-000000000302
  destructive_behavior: Integration tests truncate their dedicated test database and must never target hod or postgres.
  seed_scope: Seed/reset scripts touch only the stable IDs listed above and their dependent rows; they do not truncate the database.
verification_order:
  - 'Public HTTPS check: GET https://max.mi-kod.ru/health/ready; then open the bot and Mini App from MAX with your own account.'
  - 'Live roles: the task author uses their own MAX account; the assignee is an existing member of the linked group or a second evaluator account. Both must open the bot to receive direct notifications.'
  - 'The live Mini App exchanges fresh signed MAX initData at POST /api/auth/max for a short-lived HttpOnly session; send subsequent API requests with that cookie.'
  - 'The deterministic owner, member and foreign-workspace roles below are local API fixtures only. They are not production MAX accounts.'
  - Start with docker compose -f docker-compose.yml -f docker-compose.api-test.yml up -d --build.
  - Apply test_data.seed after migrate exits successfully.
  - Create creator and assignee cookies through POST /api/auth/dev using the listed externalUserId values.
  - Verify assigned/created views and the PHOTO proof lifecycle on proof_action.
  - Create a foreign-owner cookie and verify cross-workspace isolation in both directions.
  - Run test_data.reset when the manual API check is complete.
notes:
  - The Mini App URL must be opened inside MAX; opening it in an ordinary browser does not provide MAX initData.
  - 'Bot: https://max.ru/t252_hakaton_max_bot; test group: https://max.ru/join/HYzBHJBc_LAWMGg0FexqzpPVdl7UMzngIbuyIERBFT0.'
  - 'No dedicated production login/password exists: MAX authenticates each evaluator, and group membership supplies the live workspace context.'
  - 'To verify API roles without relying on live participants, use the isolated local fixture stack and externalUserId values above; /api/auth/dev is disabled in production.'
  - Never commit live initData, session cookies, bot tokens, provider credentials or passwords.
  - MAX webhook /max/webhook is provider-facing and is therefore excluded from user API checks.
